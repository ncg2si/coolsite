<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1F2933"/></marker></defs>
<rect width="1800" height="1060" fill="#fff"/>
<text x="900" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#1F2933">Same 30 °C, different answer</text>
<text x="900" y="118" text-anchor="middle" font-size="26" fill="#52606D">How cold can “sweating” (evaporative cooling) make the air for the servers?</text>
<rect x="580.0" y="190" width="720.0" height="700" fill="#E7F4EC"/>
<text x="940.0" y="226" text-anchor="middle" font-size="24" font-weight="700" fill="#2E8B57">Servers are happy: 18–27 °C</text>
<text x="940.0" y="256" text-anchor="middle" font-size="20" fill="#2E8B57">(ASHRAE recommended inlet air)</text>
<line x1="1300.0" y1="190" x2="1300.0" y2="890" stroke="#2E8B57" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="260" y1="890" x2="1700" y2="890" stroke="#52606D" stroke-width="3"/>
<line x1="260.0" y1="890" x2="260.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="260.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">14</text>
<line x1="420.0" y1="890" x2="420.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="420.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">16</text>
<line x1="580.0" y1="890" x2="580.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="580.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">18</text>
<line x1="740.0" y1="890" x2="740.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="740.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">20</text>
<line x1="900.0" y1="890" x2="900.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="900.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">22</text>
<line x1="1060.0" y1="890" x2="1060.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="1060.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">24</text>
<line x1="1220.0" y1="890" x2="1220.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="1220.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">26</text>
<line x1="1380.0" y1="890" x2="1380.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="1380.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">28</text>
<line x1="1540.0" y1="890" x2="1540.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="1540.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">30</text>
<line x1="1700.0" y1="890" x2="1700.0" y2="902" stroke="#52606D" stroke-width="3"/>
<text x="1700.0" y="934" text-anchor="middle" font-size="22" fill="#52606D">32</text>
<text x="1700" y="972" text-anchor="end" font-size="22" fill="#52606D">°C</text>
<text x="40" y="392" font-size="30" font-weight="700" fill="#2F7FC1">A dry day</text>
<text x="40" y="426" font-size="21" fill="#52606D">30 °C · 30 % humidity</text>
<circle cx="1540.0" cy="400" r="16" fill="#1F2933"/>
<text x="1540.0" y="370" text-anchor="middle" font-size="22" fill="#1F2933">outside air 30</text>
<circle cx="611.9999999999999" cy="400" r="16" fill="#fff" stroke="#2F7FC1" stroke-width="5"/>
<text x="611.9999999999999" y="450" text-anchor="middle" font-size="22" fill="#2F7FC1">wet-bulb 18.4</text>
<line x1="1522.0" y1="400" x2="817.9999999999999" y2="400" stroke="#1F2933" stroke-width="5" marker-end="url(#ar)"/>
<rect x="781.9999999999999" y="386" width="28" height="28" fill="#2F7FC1" transform="rotate(45 795.9999999999999 400)"/>
<text x="795.9999999999999" y="366" text-anchor="middle" font-size="22" font-weight="700" fill="#2F7FC1">≈ 21 °C</text>
<text x="40" y="478" font-size="24" font-weight="700" fill="#2F7FC1">✓ evaporative works</text>
<text x="40" y="508" font-size="20" fill="#1F2933">≈ 21 °C, inside 18–27 °C</text>
<text x="40" y="692" font-size="30" font-weight="700" fill="#C8473A">A sticky day</text>
<text x="40" y="726" font-size="21" fill="#52606D">30 °C · 90 % humidity</text>
<circle cx="1540.0" cy="700" r="16" fill="#1F2933"/>
<text x="1540.0" y="670" text-anchor="middle" font-size="22" fill="#1F2933">outside air 30</text>
<circle cx="1428.0000000000002" cy="700" r="16" fill="#fff" stroke="#2F7FC1" stroke-width="5"/>
<text x="1428.0000000000002" y="750" text-anchor="middle" font-size="22" fill="#2F7FC1">wet-bulb 28.6</text>
<line x1="1522.0" y1="700" x2="1474.0" y2="700" stroke="#1F2933" stroke-width="5" marker-end="url(#ar)"/>
<rect x="1438.0" y="686" width="28" height="28" fill="#C8473A" transform="rotate(45 1452.0 700)"/>
<text x="1442.0" y="790" text-anchor="middle" font-size="22" font-weight="700" fill="#C8473A">≈ 29 °C</text>
<text x="40" y="778" font-size="24" font-weight="700" fill="#C8473A">✗ chiller needed</text>
<text x="40" y="808" font-size="20" fill="#1F2933">≈ 29 °C, above 27 °C</text>
<text x="40" y="1020" font-size="22" fill="#1F2933">Evaporative cooling can only bring air down <tspan font-weight="700">towards the wet-bulb temperature, never below it</tspan>. So the wet-bulb, not the thermometer, decides.</text>
<text x="40" y="1050" font-size="18" fill="#7B8794">Illustration: cooler effectiveness 0.8 assumed (air out = T − 0.8 × (T − wet-bulb)); wet-bulb via Stull (2011). Real coolers vary.</text>
<g font-size="22" fill="#52606D"><circle cx="560" cy="150" r="11" fill="#1F2933"/><text x="580" y="158">outside air</text><circle cx="760" cy="150" r="11" fill="#fff" stroke="#2F7FC1" stroke-width="4"/><text x="780" y="158">wet-bulb = the limit</text><rect x="1031" y="139" width="22" height="22" fill="#52606D" transform="rotate(45 1042 150)"/><text x="1064" y="158">air after evaporative cooling (80 % of the way, example)</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>