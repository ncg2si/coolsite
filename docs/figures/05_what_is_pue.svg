<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1800" height="900" fill="#fff"/>
<text x="60" y="70" font-size="40" font-weight="700" fill="#1F2933">Power Usage Effectiveness (PUE)</text>
<text x="60" y="110" font-size="24" fill="#52606D">Total facility energy per unit of IT energy · ideal = 1.0 · lower is better</text>
<line x1="60" y1="138" x2="1740" y2="138" stroke="#E4E7EB" stroke-width="2"/>
<text x="60" y="200" font-size="22" font-weight="700" fill="#52606D">DEFINITION (EU 2024/1364, Annex III)</text>
<text x="60" y="262" font-size="44" fill="#1F2933">PUE = E<tspan font-size="26" dy="10">DC</tspan><tspan dy="-10"> / E</tspan><tspan font-size="26" dy="10">IT</tspan></text>
<text x="60" y="310" font-size="21" fill="#52606D">E<tspan font-size="15" dy="6">DC</tspan><tspan dy="-6"> = total data-centre energy · E</tspan><tspan font-size="15" dy="6">IT</tspan><tspan dy="-6"> = energy delivered to IT equipment</tspan></text>
<text x="60" y="390" font-size="22" font-weight="700" fill="#52606D">EXAMPLE: PUE 1.30</text>
<rect x="60" y="410" width="560" height="70" fill="#3E4C59"/>
<text x="340.0" y="454" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">IT load 1.00</text>
<rect x="624" y="410" width="164.0" height="70" fill="#C8473A"/>
<text x="706.0" y="454" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">0.30</text>
<text x="624" y="512" font-size="20" fill="#52606D">overhead: cooling, power</text>
<text x="624" y="538" font-size="20" fill="#52606D">conversion losses, lighting</text>
<text x="60" y="620" font-size="21" fill="#1F2933">Cooling is the largest overhead component:</text>
<text x="60" y="650" font-size="21" fill="#1F2933">≈ 7 % (efficient hyperscale) to &gt; 30 % (enterprise)</text>
<text x="60" y="680" font-size="21" fill="#1F2933">of data-centre electricity (IEA 2025).</text>
<text x="60" y="740" font-size="21" font-weight="700" fill="#2E8B57">Climate link: every free-cooling hour shrinks the</text>
<text x="60" y="770" font-size="21" font-weight="700" fill="#2E8B57">cooling overhead → lower annual PUE.</text>
<text x="900" y="200" font-size="22" font-weight="700" fill="#52606D">REFERENCE VALUES</text>
<text x="900" y="238" font-size="20" fill="#52606D">EU rating (adopted 21 Sep 2026, not yet in force)</text>
<rect x="900.0" y="250" width="122.99999999999989" height="40" fill="#2E8B57"/>
<rect x="1022.9999999999999" y="250" width="615.0000000000001" height="40" fill="#E9EDF1"/>
<rect x="1638.0" y="250" width="82.0" height="40" fill="#C8473A"/>
<text x="961.5" y="277" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">A ≤1.15</text>
<text x="1330.5" y="277" text-anchor="middle" font-size="19" fill="#52606D">classes B – F</text>
<text x="1679.0" y="277" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">G</text>
<line x1="900" y1="760" x2="1720" y2="760" stroke="#52606D" stroke-width="2"/>
<line x1="900.0" y1="760" x2="900.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="900.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.0</text>
<line x1="982.0000000000001" y1="760" x2="982.0000000000001" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="982.0000000000001" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.1</text>
<line x1="1064.0" y1="760" x2="1064.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1064.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.2</text>
<line x1="1146.0" y1="760" x2="1146.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1146.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.3</text>
<line x1="1228.0" y1="760" x2="1228.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1228.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.4</text>
<line x1="1310.0" y1="760" x2="1310.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1310.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.5</text>
<line x1="1392.0" y1="760" x2="1392.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1392.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.6</text>
<line x1="1474.0" y1="760" x2="1474.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1474.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.7</text>
<line x1="1556.0" y1="760" x2="1556.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1556.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.8</text>
<line x1="1638.0" y1="760" x2="1638.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1638.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">1.9</text>
<line x1="1720.0" y1="760" x2="1720.0" y2="770" stroke="#52606D" stroke-width="2"/>
<text x="1720.0" y="796" text-anchor="middle" font-size="19" fill="#52606D">2.0</text>
<text x="1720" y="826" text-anchor="end" font-size="19" fill="#52606D">annual PUE</text>
<line x1="1064.0" y1="360" x2="1064.0" y2="760" stroke="#1F2933" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="1064.0" cy="360" r="7" fill="#1F2933"/>
<text x="1080.0" y="367" font-size="20" fill="#1F2933">EnEfG: new data centres (≤ 1.2)</text>
<line x1="1146.0" y1="440" x2="1146.0" y2="760" stroke="#1F2933" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="1146.0" cy="440" r="7" fill="#1F2933"/>
<text x="1162.0" y="447" font-size="20" fill="#1F2933">EnEfG: existing, from Jul 2030 (≤ 1.3)</text>
<line x1="1195.2" y1="520" x2="1195.2" y2="760" stroke="#2F7FC1" stroke-width="2" stroke-dasharray="6 5"/>
