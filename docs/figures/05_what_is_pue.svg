<text x="1211.2" y="527" font-size="20" fill="#2F7FC1">EU reported average 2024 (≈ 1.36)*</text>
<line x1="1310.0" y1="600" x2="1310.0" y2="760" stroke="#1F2933" stroke-width="2" stroke-dasharray="6 5"/>
