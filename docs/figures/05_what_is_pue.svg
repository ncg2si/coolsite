<text x="1326.0" y="607" font-size="20" fill="#1F2933">EnEfG: existing, from Jul 2027 (≤ 1.5)</text>
<text x="60" y="870" font-size="17" fill="#9AA5B1">Sources: EU Reg. 2024/1364; EnEfG § 11 (amendment BT-Drs. 21/8027 pending); EU rating C(2026) 3472; IEA 2025. * reported-site aggregate, DCD 2026 (to verify).</text>
