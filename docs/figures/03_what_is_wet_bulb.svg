<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1800" height="1060" fill="#fff"/>
<text x="900" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#1F2933">What is the wet-bulb temperature?</text>
<text x="900" y="118" text-anchor="middle" font-size="26" fill="#52606D">Wrap a thermometer in a wet sock and blow air over it. The water dries and cools it down.</text>
<text x="900" y="152" text-anchor="middle" font-size="26" fill="#52606D">That reading is the wet-bulb temperature: <tspan font-weight="700" fill="#1F2933">the coldest you can get with water alone.</tspan></text>
<rect x="60" y="200" width="820" height="800" rx="22" fill="#EEF5FB" stroke="#2F7FC1" stroke-width="3"/>
<text x="470" y="262" text-anchor="middle" font-size="36" font-weight="700" fill="#2F7FC1">A dry day</text>
<text x="470" y="302" text-anchor="middle" font-size="26" fill="#1F2933">30 °C, humidity 30 %</text>
<path d="M120 570 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/><path d="M120 600 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/><path d="M120 630 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(360,700)"><rect x="-16" y="-260" width="32" height="280" rx="16" fill="#fff" stroke="#52606D" stroke-width="4"/><rect x="-7" y="-192.0" width="14" height="212.0" fill="#C8473A"/><circle cx="0" cy="34" r="30" fill="#C8473A" stroke="#52606D" stroke-width="4"/><line x1="16" y1="0.0" x2="28" y2="0.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-48.0" x2="28" y2="-48.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-96.0" x2="28" y2="-96.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-144.0" x2="28" y2="-144.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-192.0" x2="28" y2="-192.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-240.0" x2="28" y2="-240.0" stroke="#52606D" stroke-width="2"/><text x="0" y="-280" text-anchor="middle" font-size="40" font-weight="700" fill="#1F2933">30 °C</text><text x="0" y="112" text-anchor="middle" font-size="22" fill="#52606D">normal thermometer</text></g>
<g transform="translate(620,700)"><rect x="-16" y="-260" width="32" height="280" rx="16" fill="#fff" stroke="#52606D" stroke-width="4"/><rect x="-7" y="-80.63999999999999" width="14" height="100.63999999999999" fill="#2F7FC1"/><circle cx="0" cy="34" r="30" fill="#2F7FC1" stroke="#52606D" stroke-width="4"/><line x1="16" y1="0.0" x2="28" y2="0.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-48.0" x2="28" y2="-48.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-96.0" x2="28" y2="-96.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-144.0" x2="28" y2="-144.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-192.0" x2="28" y2="-192.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-240.0" x2="28" y2="-240.0" stroke="#52606D" stroke-width="2"/><path d="M-36 6 Q0 -14 36 6 L36 62 Q0 82 -36 62 Z" fill="#9CC7EA" opacity="0.85" stroke="#2F7FC1" stroke-width="3"/><path d="M-6 70 q6 10 0 16 q-6 -6 0 -16 z" fill="#2F7FC1"/><path d="M14 66 q5 9 0 14 q-5 -5 0 -14 z" fill="#2F7FC1"/><text x="0" y="-280" text-anchor="middle" font-size="40" font-weight="700" fill="#1F2933">18 °C</text><text x="0" y="112" text-anchor="middle" font-size="22" fill="#52606D">wet sock thermometer</text></g>
<text x="470" y="905" text-anchor="middle" font-size="28" fill="#1F2933">Dry air soaks up water fast</text>
<text x="470" y="948" text-anchor="middle" font-size="28" font-weight="700" fill="#2F7FC1">→ big drop: 12 degrees colder</text>
<rect x="920" y="200" width="820" height="800" rx="22" fill="#FCF0EE" stroke="#C8473A" stroke-width="3"/>
<text x="1330" y="262" text-anchor="middle" font-size="36" font-weight="700" fill="#C8473A">A sticky day</text>
<text x="1330" y="302" text-anchor="middle" font-size="26" fill="#1F2933">30 °C, humidity 90 %</text>
<path d="M980 570 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/><path d="M980 600 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/><path d="M980 630 q18 -10 36 0 t36 0" fill="none" stroke="#B9C4CE" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(1220,700)"><rect x="-16" y="-260" width="32" height="280" rx="16" fill="#fff" stroke="#52606D" stroke-width="4"/><rect x="-7" y="-192.0" width="14" height="212.0" fill="#C8473A"/><circle cx="0" cy="34" r="30" fill="#C8473A" stroke="#52606D" stroke-width="4"/><line x1="16" y1="0.0" x2="28" y2="0.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-48.0" x2="28" y2="-48.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-96.0" x2="28" y2="-96.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-144.0" x2="28" y2="-144.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-192.0" x2="28" y2="-192.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-240.0" x2="28" y2="-240.0" stroke="#52606D" stroke-width="2"/><text x="0" y="-280" text-anchor="middle" font-size="40" font-weight="700" fill="#1F2933">30 °C</text><text x="0" y="112" text-anchor="middle" font-size="22" fill="#52606D">normal thermometer</text></g>
<g transform="translate(1480,700)"><rect x="-16" y="-260" width="32" height="280" rx="16" fill="#fff" stroke="#52606D" stroke-width="4"/><rect x="-7" y="-178.56000000000003" width="14" height="198.56000000000003" fill="#2F7FC1"/><circle cx="0" cy="34" r="30" fill="#2F7FC1" stroke="#52606D" stroke-width="4"/><line x1="16" y1="0.0" x2="28" y2="0.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-48.0" x2="28" y2="-48.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-96.0" x2="28" y2="-96.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-144.0" x2="28" y2="-144.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-192.0" x2="28" y2="-192.0" stroke="#52606D" stroke-width="2"/><line x1="16" y1="-240.0" x2="28" y2="-240.0" stroke="#52606D" stroke-width="2"/><path d="M-36 6 Q0 -14 36 6 L36 62 Q0 82 -36 62 Z" fill="#9CC7EA" opacity="0.85" stroke="#2F7FC1" stroke-width="3"/><path d="M-6 70 q6 10 0 16 q-6 -6 0 -16 z" fill="#2F7FC1"/><path d="M14 66 q5 9 0 14 q-5 -5 0 -14 z" fill="#2F7FC1"/><text x="0" y="-280" text-anchor="middle" font-size="40" font-weight="700" fill="#1F2933">29 °C</text><text x="0" y="112" text-anchor="middle" font-size="22" fill="#52606D">wet sock thermometer</text></g>
<text x="1330" y="905" text-anchor="middle" font-size="28" fill="#1F2933">Air is already full of water</text>
<text x="1330" y="948" text-anchor="middle" font-size="28" font-weight="700" fill="#C8473A">→ tiny drop: under 2 degrees</text>
<text x="60" y="1040" font-size="19" fill="#7B8794">Wet-bulb values computed with the Stull (2011) formula, the same one used in CoolSite. Same air temperature, very different cooling power.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>