<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1800" height="900" fill="#fff"/>
<text x="60" y="70" font-size="40" font-weight="700" fill="#1F2933">Water Usage Effectiveness (WUE)</text>
<text x="60" y="110" font-size="24" fill="#52606D">Site water use per unit of IT energy · litres per kWh · ideal = 0 · lower is better</text>
<line x1="60" y1="138" x2="1740" y2="138" stroke="#E4E7EB" stroke-width="2"/>
<text x="60" y="200" font-size="22" font-weight="700" fill="#52606D">DEFINITION (EU 2024/1364, Annex III)</text>
<text x="60" y="262" font-size="44" fill="#1F2933">WUE = W<tspan font-size="26" dy="10">IN</tspan><tspan dy="-10"> / E</tspan><tspan font-size="26" dy="10">IT</tspan><tspan font-size="30" fill="#52606D">  [L/kWh]</tspan></text>
<text x="60" y="310" font-size="21" fill="#52606D">W<tspan font-size="15" dy="6">IN</tspan><tspan dy="-6"> = total water input · rating uses fresh-water input only</tspan></text>
<text x="60" y="390" font-size="20" fill="#52606D">EU rating (adopted, not yet in force) · no legal WUE limit in EU or DE</text>
<rect x="60.0" y="405" width="58.33333333333334" height="40" fill="#2E8B57"/>
<rect x="118.33333333333334" y="405" width="525.0" height="40" fill="#E9EDF1"/>
<rect x="643.3333333333334" y="405" width="116.66666666666663" height="40" fill="#C8473A"/>
<text x="89.16666666666667" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">A</text>
<text x="380.83333333333337" y="432" text-anchor="middle" font-size="19" fill="#52606D">classes B – F</text>
<text x="701.6666666666667" y="432" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">G</text>
<text x="60.0" y="477" text-anchor="middle" font-size="19" fill="#52606D">0.0</text>
<text x="176.66666666666669" y="477" text-anchor="middle" font-size="19" fill="#52606D">0.2</text>
<text x="293.33333333333337" y="477" text-anchor="middle" font-size="19" fill="#52606D">0.4</text>
<text x="410.0" y="477" text-anchor="middle" font-size="19" fill="#52606D">0.6</text>
<text x="526.6666666666667" y="477" text-anchor="middle" font-size="19" fill="#52606D">0.8</text>
<text x="643.3333333333334" y="477" text-anchor="middle" font-size="19" fill="#52606D">1.0</text>
<text x="760.0" y="477" text-anchor="middle" font-size="19" fill="#52606D">1.2</text>
<text x="760.0" y="505" text-anchor="end" font-size="19" fill="#52606D">L/kWh</text>
<text x="60" y="590" font-size="21" fill="#1F2933">A ≤ 0.1 L/kWh · G &gt; 1.0 L/kWh</text>
<text x="60" y="660" font-size="21" font-weight="700" fill="#2E8B57">Climate link: evaporative-cooling hours are the main</text>
<text x="60" y="690" font-size="21" font-weight="700" fill="#2E8B57">driver of WUE. CoolSite counts them per city-year</text>
<text x="60" y="720" font-size="21" font-weight="700" fill="#2E8B57">(a proxy, not litres).</text>
<text x="960" y="180" font-size="22" font-weight="700" fill="#52606D">PUE – WUE TRADE-OFF BY COOLING MODE (schematic)</text>
<rect x="960" y="200" width="760" height="600" fill="#FAFBFC" stroke="#E4E7EB" stroke-width="2"/>
<line x1="1340.0" y1="200" x2="1340.0" y2="800" stroke="#E4E7EB" stroke-width="2"/>
<line x1="960" y1="500.0" x2="1720" y2="500.0" stroke="#E4E7EB" stroke-width="2"/>
<text x="1340.0" y="840" text-anchor="middle" font-size="20" fill="#52606D">electricity overhead (PUE impact) →</text>
<text x="942" y="500.0" text-anchor="middle" font-size="20" fill="#52606D" transform="rotate(-90 942 500.0)">water use (WUE impact) →</text>
<circle cx="1112.0" cy="680.0" r="16" fill="#2E8B57"/>
<text x="1112.0" y="650.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2933">Free cooling</text>
<text x="1112.0" y="726.0" text-anchor="middle" font-size="19" fill="#52606D">low PUE · ~no water</text>
<circle cx="1150.0" cy="332.0" r="16" fill="#2F7FC1"/>
<text x="1150.0" y="302.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2933">Evaporative</text>
<text x="1150.0" y="378.0" text-anchor="middle" font-size="19" fill="#52606D">low PUE · high water</text>
<circle cx="1552.8000000000002" cy="680.0" r="16" fill="#C8473A"/>
<text x="1552.8000000000002" y="650.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2933">Chiller + dry cooler</text>
<text x="1552.8000000000002" y="726.0" text-anchor="middle" font-size="19" fill="#52606D">high PUE · ~no water</text>
<circle cx="1552.8000000000002" cy="320.0" r="16" fill="#D9902F"/>
<text x="1552.8000000000002" y="290.0" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2933">Chiller + cooling tower</text>
<text x="1552.8000000000002" y="366.0" text-anchor="middle" font-size="19" fill="#52606D">high PUE · water</text>
<text x="60" y="870" font-size="17" fill="#9AA5B1">Sources: EU Delegated Reg. 2024/1364 (WUE = W_IN / E_IT); EU rating C(2026) 3472 (fresh-water WUE, classes A–G). Quadrant positions are qualitative.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>