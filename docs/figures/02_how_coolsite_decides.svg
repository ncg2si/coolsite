<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52606D"/></marker>
  </defs>
  <rect width="1800" height="1060" fill="#FFFFFF"/>
  <text x="900" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#1F2933">How CoolSite decides, hour by hour</text>
  <text x="900" y="118" text-anchor="middle" font-size="26" fill="#52606D">Three checks on the outside air → exactly one cooling mode for every hour (direct design)</text>

  <!-- start -->
  <rect x="40" y="205" width="270" height="120" rx="20" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="3"/>
  <text x="175" y="257" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Every hour:</text>
  <text x="175" y="295" text-anchor="middle" font-size="24" fill="#1F2933">the outside air</text>
  <line x1="310" y1="265" x2="350" y2="265" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>

  <!-- Q0 dew point (direct only) -->
  <text x="455" y="165" text-anchor="middle" font-size="19" font-weight="700" fill="#7B8794">direct design only</text>
  <polygon points="455,180 555,265 455,350 355,265" fill="#FFF8E6" stroke="#E8A33D" stroke-width="4"/>
  <text x="455" y="256" text-anchor="middle" font-size="23" font-weight="700" fill="#1F2933">Dew point</text>
  <text x="455" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#1F2933">≤ 15 °C?</text>
  <line x1="555" y1="265" x2="578" y2="265" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="566" y="240" text-anchor="middle" font-size="21" font-weight="700" fill="#2E8B57">yes</text>

  <!-- Q1 temperature -->
  <polygon points="790,155 1000,265 790,375 580,265" fill="#FFF8E6" stroke="#E8A33D" stroke-width="4"/>
  <text x="790" y="252" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Air temperature</text>
  <text x="790" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">below A?</text>
  <text x="790" y="405" text-anchor="middle" font-size="21" fill="#7B8794">(is it cool enough?)</text>

  <line x1="1000" y1="265" x2="1290" y2="265" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1145" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#2E8B57">yes</text>
  <rect x="1300" y="195" width="420" height="140" rx="20" fill="#2E8B57"/>
  <text x="1510" y="255" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Free cooling</text>
  <text x="1510" y="298" text-anchor="middle" font-size="23" fill="#fff" opacity="0.9">like a fan · no water, little electricity</text>
  <text x="1720" y="364" text-anchor="end" font-size="19" font-weight="700" fill="#2E8B57">+ flag too_dry if dew point &lt; −9 °C (humidifier → water)</text>

  <!-- Q1 no → Q2 -->
  <line x1="790" y1="420" x2="790" y2="505" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="820" y="472" font-size="26" font-weight="700" fill="#C8473A">no</text>

  <polygon points="790,515 1000,625 790,735 580,625" fill="#FFF8E6" stroke="#E8A33D" stroke-width="4"/>
  <text x="790" y="612" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Wet-bulb</text>
  <text x="790" y="646" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">below B?</text>
  <text x="790" y="768" text-anchor="middle" font-size="21" fill="#7B8794">(can sweat still work?)</text>
  <text x="790" y="796" text-anchor="middle" font-size="21" fill="#7B8794">wet-bulb = temperature + humidity</text>

  <line x1="1000" y1="625" x2="1290" y2="625" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1145" y="610" text-anchor="middle" font-size="26" font-weight="700" fill="#2E8B57">yes</text>
  <rect x="1300" y="555" width="420" height="140" rx="20" fill="#2F7FC1"/>
  <text x="1510" y="615" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Evaporative cooling</text>
  <text x="1510" y="658" text-anchor="middle" font-size="23" fill="#fff" opacity="0.9">like sweating · uses water</text>

  <path d="M790 815 V 905 H 1290" fill="none" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1040" y="890" text-anchor="middle" font-size="26" font-weight="700" fill="#C8473A">no (too hot and humid)</text>
  <rect x="1300" y="845" width="420" height="140" rx="20" fill="#C8473A"/>
  <text x="1510" y="905" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Chiller</text>
  <text x="1510" y="948" text-anchor="middle" font-size="23" fill="#fff" opacity="0.9">like an AC · lots of electricity</text>

  <!-- Q0 no → chiller (humidity-limited) -->
  <path d="M455 350 V 955 H 1290" fill="none" stroke="#C8473A" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#ar)"/>
  <text x="475" y="985" font-size="20" font-weight="700" fill="#C8473A">no → too humid to let outside air in → chiller dries the air (flag: humidity_limited)</text>

  <!-- explainer -->
  <rect x="40" y="440" width="390" height="300" rx="20" fill="#EEF5FB" stroke="#2F7FC1" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="62" y="485" font-size="24" font-weight="700" fill="#2F7FC1">Why humidity matters</text>
  <text x="62" y="528" font-size="22" fill="#1F2933">On a dry day, sweat dries</text>
  <text x="62" y="558" font-size="22" fill="#1F2933">fast and cools you down.</text>
  <text x="62" y="604" font-size="22" fill="#1F2933">On a sticky day, the air is</text>
  <text x="62" y="634" font-size="22" fill="#1F2933">already full of water. Sweat</text>
  <text x="62" y="664" font-size="22" fill="#1F2933">can't dry, so you stay hot.</text>
  <text x="62" y="710" font-size="22" font-weight="700" fill="#1F2933">Same for the data centre.</text>

  <text x="40" y="1022" font-size="20" fill="#52606D">Then CoolSite counts the hours of each mode, per city and year: more free-cooling hours = less electricity and less water.</text>
  <text x="40" y="1050" font-size="17" fill="#7B8794">A, B = configurable (A from ASHRAE; B to be sourced). Dew-point limits −9 … 15 °C = ASHRAE recommended. Indirect design: no dew-point check, A lowered by the heat-exchanger effectiveness (see picture 09).</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
