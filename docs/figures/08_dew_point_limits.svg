<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1800" height="760" fill="#fff"/>
<text x="60" y="70" font-size="40" font-weight="700" fill="#1F2933">Why the dew-point limits matter</text>
<text x="60" y="110" font-size="24" fill="#52606D">Dew point = how much water the air holds. ASHRAE recommended range for server inlet air: −9 °C … 15 °C</text>
<line x1="60" y1="138" x2="1740" y2="138" stroke="#E4E7EB" stroke-width="2"/>
<rect x="60.0" y="230" width="410.66666666666663" height="70" fill="#DCEAF7"/>
<rect x="470.66666666666663" y="230" width="896.0000000000001" height="70" fill="#E3F2E8"/>
<rect x="1366.6666666666667" y="230" width="373.33333333333326" height="70" fill="#F8E1DE"/>
<text x="265.3333333333333" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#2F7FC1">too dry</text>
<text x="918.6666666666667" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#2E8B57">recommended</text>
<text x="1553.3333333333335" y="274" text-anchor="middle" font-size="24" font-weight="700" fill="#C8473A">too humid</text>
<line x1="60.0" y1="300" x2="60.0" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="60.0" y="336" text-anchor="middle" font-size="19" fill="#52606D">-20</text>
<line x1="246.66666666666666" y1="300" x2="246.66666666666666" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="246.66666666666666" y="336" text-anchor="middle" font-size="19" fill="#52606D">-15</text>
<line x1="433.3333333333333" y1="300" x2="433.3333333333333" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="433.3333333333333" y="336" text-anchor="middle" font-size="19" fill="#52606D">-10</text>
<line x1="620.0" y1="300" x2="620.0" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="620.0" y="336" text-anchor="middle" font-size="19" fill="#52606D">-5</text>
<line x1="806.6666666666666" y1="300" x2="806.6666666666666" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="806.6666666666666" y="336" text-anchor="middle" font-size="19" fill="#52606D">0</text>
<line x1="993.3333333333334" y1="300" x2="993.3333333333334" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="993.3333333333334" y="336" text-anchor="middle" font-size="19" fill="#52606D">5</text>
<line x1="1180.0" y1="300" x2="1180.0" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="1180.0" y="336" text-anchor="middle" font-size="19" fill="#52606D">10</text>
<line x1="1366.6666666666667" y1="300" x2="1366.6666666666667" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="1366.6666666666667" y="336" text-anchor="middle" font-size="19" fill="#52606D">15</text>
<line x1="1553.3333333333333" y1="300" x2="1553.3333333333333" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="1553.3333333333333" y="336" text-anchor="middle" font-size="19" fill="#52606D">20</text>
<line x1="1740.0" y1="300" x2="1740.0" y2="310" stroke="#52606D" stroke-width="2"/>
<text x="1740.0" y="336" text-anchor="middle" font-size="19" fill="#52606D">25</text>
<text x="1740" y="364" text-anchor="end" font-size="19" fill="#52606D">dew point, °C</text>
<line x1="470.66666666666663" y1="210" x2="470.66666666666663" y2="300" stroke="#2F7FC1" stroke-width="3"/>
<text x="470.66666666666663" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#2F7FC1">−9 °C</text>
<line x1="1366.6666666666667" y1="210" x2="1366.6666666666667" y2="300" stroke="#C8473A" stroke-width="3"/>
<text x="1366.6666666666667" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#C8473A">15 °C</text>
<text x="60" y="440" font-size="22" font-weight="700" fill="#2F7FC1">TOO DRY  (dew point &lt; −9 °C)</text>
<text x="60" y="480" font-size="21" fill="#1F2933">Risk: static electricity (ESD) damages</text>
<text x="60" y="512" font-size="21" fill="#1F2933">electronics.</text>
<text x="60" y="544" font-size="21" fill="#1F2933">Fix: humidifiers spray water into the air.</text>
<text x="60" y="576" font-size="21" fill="#1F2933">Cost: WATER, little electricity.</text>
<text x="60" y="608" font-size="21" fill="#1F2933">CoolSite: stays free cooling + flag too_dry.</text>
<text x="60" y="640" font-size="21" fill="#1F2933">When: cold, dry winter days (Nordics,</text>
<text x="60" y="672" font-size="21" fill="#1F2933">continental cold spells: Warsaw, Prague …)</text>
<text x="640" y="440" font-size="22" font-weight="700" fill="#2E8B57">RECOMMENDED  (−9 … 15 °C)</text>
<text x="640" y="480" font-size="21" fill="#1F2933">No humidity treatment needed.</text>
<text x="640" y="512" font-size="21" fill="#1F2933">If the air is also cool enough</text>
<text x="640" y="544" font-size="21" fill="#1F2933">(T &lt; A): true free cooling —</text>
<text x="640" y="576" font-size="21" fill="#1F2933">little electricity, no water.</text>
<text x="1220" y="440" font-size="22" font-weight="700" fill="#C8473A">TOO HUMID  (dew point &gt; 15 °C)</text>
<text x="1220" y="480" font-size="21" fill="#1F2933">Risk: water condenses on cold surfaces</text>
<text x="1220" y="512" font-size="21" fill="#1F2933">→ corrosion, short circuits.</text>
<text x="1220" y="544" font-size="21" fill="#1F2933">Fix: cooling coil below dew point dries</text>
<text x="1220" y="576" font-size="21" fill="#1F2933">the air → needs a compressor.</text>
<text x="1220" y="608" font-size="21" fill="#1F2933">Cost: ELECTRICITY.</text>
<text x="1220" y="640" font-size="21" fill="#1F2933">CoolSite: → chiller + flag humidity_limited.</text>
<text x="1220" y="672" font-size="21" fill="#1F2933">When: warm, muggy nights (Milan, coast)</text>
<text x="60" y="735" font-size="17" fill="#9AA5B1">Source of range: ASHRAE TC 9.9 Thermal Guidelines (recommended envelope). Applies to direct outside-air designs; many operators accept drier air without humidifying.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>