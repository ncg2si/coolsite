<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Inter, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52606D"/></marker>
  </defs>
  <rect width="1800" height="1060" fill="#FFFFFF"/>
  <text x="900" y="72" text-anchor="middle" font-size="46" font-weight="700" fill="#1F2933">How CoolSite decides, hour by hour</text>
  <text x="900" y="118" text-anchor="middle" font-size="26" fill="#52606D">Indirect design: two checks on the outside air → exactly one cooling mode for every hour</text>

  <!-- start -->
  <rect x="40" y="205" width="300" height="120" rx="20" fill="#F5F7FA" stroke="#9AA5B1" stroke-width="3"/>
  <text x="190" y="257" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Every hour:</text>
  <text x="190" y="295" text-anchor="middle" font-size="24" fill="#1F2933">the outside air</text>
  <line x1="340" y1="265" x2="570" y2="265" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="455" y="240" text-anchor="middle" font-size="19" font-weight="700" fill="#7B8794">no dew-point check</text>

  <!-- Q1 temperature vs A_ind -->
  <polygon points="790,155 1000,265 790,375 580,265" fill="#FFF8E6" stroke="#E8A33D" stroke-width="4"/>
  <text x="790" y="252" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Air temperature</text>
  <text x="790" y="286" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">below A<tspan font-size="18" dy="6">ind</tspan><tspan dy="-6">?</tspan></text>
  <text x="790" y="405" text-anchor="middle" font-size="21" fill="#7B8794">(cool enough, even after the heat exchanger?)</text>

  <line x1="1000" y1="265" x2="1290" y2="265" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1145" y="250" text-anchor="middle" font-size="26" font-weight="700" fill="#2E8B57">yes</text>
  <rect x="1300" y="195" width="420" height="140" rx="20" fill="#2E8B57"/>
  <text x="1510" y="255" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Free cooling</text>
  <text x="1510" y="298" text-anchor="middle" font-size="23" fill="#fff" opacity="0.9">via heat exchanger · no water</text>

  <!-- no → Q2 -->
  <line x1="790" y1="420" x2="790" y2="505" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="820" y="472" font-size="26" font-weight="700" fill="#C8473A">no</text>

  <polygon points="790,515 1000,625 790,735 580,625" fill="#FFF8E6" stroke="#E8A33D" stroke-width="4"/>
  <text x="790" y="612" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">Evaporation</text>
  <text x="790" y="646" text-anchor="middle" font-size="27" font-weight="700" fill="#1F2933">enough?</text>
  <text x="790" y="768" text-anchor="middle" font-size="21" fill="#7B8794">(supply air T − 0.8 · (T − wet-bulb)</text>
  <text x="790" y="796" text-anchor="middle" font-size="21" fill="#7B8794">≤ A<tspan font-size="15" dy="5">ind</tspan><tspan dy="-5">?)</tspan></text>

  <line x1="1000" y1="625" x2="1290" y2="625" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1145" y="610" text-anchor="middle" font-size="26" font-weight="700" fill="#2E8B57">yes</text>
  <rect x="1300" y="555" width="420" height="140" rx="20" fill="#2F7FC1"/>
  <text x="1510" y="615" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Evaporative cooling</text>
  <text x="1510" y="658" text-anchor="middle" font-size="23" fill="#fff" opacity="0.9">water on outside air only · uses water</text>

  <path d="M790 815 V 915 H 1290" fill="none" stroke="#52606D" stroke-width="4" marker-end="url(#ar)"/>
  <text x="1040" y="900" text-anchor="middle" font-size="26" font-weight="700" fill="#C8473A">no (too hot even after evaporation)</text>
  <rect x="1300" y="845" width="420" height="140" rx="20" fill="#C8473A"/>
  <text x="1510" y="905" text-anchor="middle" font-size="32" font-weight="700" fill="#fff">Hybrid or chiller</text>
  <text x="1510" y="948" text-anchor="middle" font-size="22" fill="#fff" opacity="0.9">chiller, with or without evaporation</text>

  <!-- explainer with heat-exchanger sketch -->
  <rect x="40" y="440" width="440" height="420" rx="20" fill="#F1F8F4" stroke="#2E8B57" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="62" y="485" font-size="24" font-weight="700" fill="#2E8B57">Why no dew-point check?</text>
  <!-- sketch: two air streams separated by plates -->
  <g transform="translate(70,510)">
    <rect x="120" y="0" width="140" height="120" rx="8" fill="#fff" stroke="#9AA5B1" stroke-width="3"/>
    <line x1="140" y1="10" x2="140" y2="110" stroke="#9AA5B1" stroke-width="3"/>
    <line x1="165" y1="10" x2="165" y2="110" stroke="#9AA5B1" stroke-width="3"/>
    <line x1="190" y1="10" x2="190" y2="110" stroke="#9AA5B1" stroke-width="3"/>
    <line x1="215" y1="10" x2="215" y2="110" stroke="#9AA5B1" stroke-width="3"/>
    <line x1="240" y1="10" x2="240" y2="110" stroke="#9AA5B1" stroke-width="3"/>
    <path d="M10 35 H 110" stroke="#2F7FC1" stroke-width="5" marker-end="url(#ar)"/>
    <text x="0" y="5" font-size="17" fill="#2F7FC1" font-weight="700">outside air</text>
    <path d="M370 85 H 270" stroke="#C8473A" stroke-width="5" marker-end="url(#ar)"/>
    <text x="275" y="118" font-size="17" fill="#C8473A" font-weight="700">room air</text>
    <text x="190" y="142" text-anchor="middle" font-size="16" fill="#7B8794">heat exchanger plates</text>
  </g>
  <text x="62" y="700" font-size="21" fill="#1F2933">Outside air and room air never mix.</text>
  <text x="62" y="730" font-size="21" fill="#1F2933">Only heat passes through the plates,</text>
  <text x="62" y="760" font-size="21" fill="#1F2933">so outside humidity stays outside.</text>
  <text x="62" y="806" font-size="21" font-weight="700" fill="#1F2933">Price: the plates pass only a share</text>
  <text x="62" y="836" font-size="21" font-weight="700" fill="#1F2933">ε of the cooling → colder air needed.</text>

  <text x="40" y="1012" font-size="20" fill="#52606D">A<tspan font-size="14" dy="5">ind</tspan><tspan dy="-5"> = T</tspan><tspan font-size="14" dy="5">return</tspan><tspan dy="-5"> − (T</tspan><tspan font-size="14" dy="5">return</tspan><tspan dy="-5"> − A) / ε  ·  example with ε = 0.7: 37 − (37 − 27) / 0.7 ≈ 22.7 °C.</tspan></text>
  <text x="40" y="1044" font-size="17" fill="#7B8794">ε = heat-exchanger effectiveness: design parameter, 0.7 (ASHRAE Handbook ch. 41; Park &amp; Seo 2018). Return air 37 °C = A + 10 K server ΔT. No dew-point flags. Compare: pictures 02 and 09.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
