[project]
name = "coolsite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cam Lai Ngo", email = "ngo.camlai@yahoo.com" }
]
requires-python = ">=3.13"
dependencies = [
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pyspark>=4.3.0",
    "requests>=2.34.2",
]

[project.scripts]
coolsite = "coolsite:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
pythonpath = ["src"]

filterwarnings = ["ignore:PySpark does not yet fully support pandas:FutureWarning"]
